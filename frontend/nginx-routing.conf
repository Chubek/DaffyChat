# Nginx configuration for DaffyChat short room URLs
# Add this to your nginx server block

location ~ ^/([a-zA-Z0-9-]{4,10})$ {
    # Check if it's not an existing file or directory
    if (!-e $request_filename) {
        rewrite ^/(.*)$ /r.html?name=$1 last;
    }
}

location /r/ {
    rewrite ^/r/([a-zA-Z0-9-]{4,10})$ /r.html?name=$1 last;
}

# API proxy (if backend is on different port)
location /api/ {
    proxy_pass http://localhost:7001/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
}
