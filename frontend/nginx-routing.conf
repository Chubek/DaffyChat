# Nginx configuration for DaffyChat short room URLs
# Put this inside your `server { ... }` block

# Short URLs like: /abcd-1234 (no dot at the end so it doesn't clash with real files)
location ~ "^/[A-Za-z0-9-]{4,10}$" {
    try_files $uri /room.html;
}

# Short URLs with /r/ prefix like: /r/abcd-1234
location ~ "^/r/[A-Za-z0-9-]{4,10}$" {
    rewrite ^/r/[A-Za-z0-9-]{4,10}$ /room.html last;
}

# API proxy (if backend is on different port)
location /api/ {
    proxy_pass http://localhost:7001;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
}
